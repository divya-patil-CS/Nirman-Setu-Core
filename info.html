<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YojanaLink profile information">
  <title>YojanaLink | जानकारी</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <div class="page-shell">

    <!-- HEADER -->
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="YojanaLink home">
        <span class="brand-mark" aria-hidden="true">Y</span>

        <span>
          <span class="brand-name">YojanaLink</span>
          <span class="brand-tagline">आपकी योजनाओं का दुवा</span>
        </span>
      </a>

      <p class="header-note">
        सरकारी योजनाओं की जानकारी, अब आपकी भाषा में
      </p>
    </header>

    <!-- MAIN CONTENT -->
    <main class="login-main">
      <section class="login-panel" aria-labelledby="info-heading">
        <p class="eyebrow">आपका स्वागत है</p>
        <h1 id="info-heading">अपनी जानकारी भरें</h1>

        <p class="login-intro">
          आपके लिए सही योजनाएं खोजने के लिए अपनी जानकारी दर्ज करें।
        </p>

        <!-- PROFILE FORM -->
        <form
          class="info-form"
          id="infoForm"
          novalidate
          enctype="multipart/form-data"
        >
          <!-- NAME -->
          <label class="form-label" for="full-name">पूरा नाम</label>
          <input
            class="form-input"
            id="full-name"
            name="fullName"
            type="text"
            autocomplete="name"
            placeholder="अपना पूरा नाम दर्ज करें"
            required
          >

          <!-- LOCATION -->
          <label class="form-label" for="location">स्थान</label>
          <input
            class="form-input"
            id="location"
            name="location"
            type="text"
            autocomplete="address-level2"
            placeholder="अपना शहर या गांव दर्ज करें"
            required
          >

          <!-- PHONE -->
          <label class="form-label" for="profile-phone">मोबाइल नंबर</label>
          <input
            class="form-input"
            id="profile-phone"
            name="phone"
            type="tel"
            inputmode="numeric"
            maxlength="10"
            autocomplete="tel"
            placeholder="10 अंकों का मोबाइल नंबर"
            required
          >

          <!-- DOCUMENT UPLOAD -->
          <label class="form-label" for="user-document">
            दस्तावेज़ अपलोड करें
          </label>
          <input
            class="form-input document-input"
            id="user-document"
            name="document"
            type="file"
            accept=".pdf,.jpg,.jpeg,.png"
            required
          >

          <small class="upload-note">
            PDF, JPG या PNG दस्तावेज़ अपलोड करें।
          </small>

          <button class="continue-button" type="submit">
            जानकारी जमा करें
          </button>

          <p class="form-message" role="status" aria-live="polite"></p>
        </form>
        <a class="secondary-link" href="index.html">
          भाषा बदलें
        </a>
      </section>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">
      <p>
        सरल <span aria-hidden="true">•</span>
        सुरक्षित <span aria-hidden="true">•</span>
        आपके लिए
      </p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
