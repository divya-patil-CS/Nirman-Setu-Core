<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="YojanaLink - सरकारी योजनाओं की जानकारी सरल भाषा में">
  <title>YojanaLink</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="YojanaLink home">
        <span class="brand-mark" aria-hidden="true">Y</span>
        <span>
          <span class="brand-name">YojanaLink</span>
          <span class="brand-tagline" data-i18n="tagline">सरकारी योजनाओं का दुवा</span>
        </span>
      </a>
      <p class="header-note" data-i18n="headerNote">सरकारी योजनाओं की जानकारी, अब आपकी भाषा में</p>
    </header>

    <main class="language-main">
      <section class="language-panel" aria-labelledby="language-heading">
        <p class="eyebrow" data-i18n="welcome">आपका स्वागत है</p>
        <h1 id="language-heading" data-i18n="chooseLanguage">अपनी भाषा चुनें</h1>
        <p class="intro-text" data-i18n="languagePrompt">अपने आराम की भाषा चुनें</p>

        <div class="language-options" role="group" data-i18n-aria="languageOptionsLabel" aria-label="भाषा चुनें">
          <button class="language-option" type="button" data-language="hi" aria-pressed="false">
            <span class="language-native" data-i18n="hindi">हिंदी</span>
            <span class="language-english" data-i18n="hindiEnglish">Hindi</span>
          </button>
          <button class="language-option" type="button" data-language="mr" aria-pressed="false">
            <span class="language-native" data-i18n="marathi">मराठी</span>
            <span class="language-english" data-i18n="marathiEnglish">Marathi</span>
          </button>
          <button class="language-option" type="button" data-language="en" aria-pressed="false">
            <span class="language-native" data-i18n="english">English</span>
            <span class="language-english" data-i18n="englishEnglish">English</span>
          </button>
        </div>

        <button class="continue-button" type="button" data-i18n="continue">आगे बढ़ें</button>

        <p class="selection-message" role="status" aria-live="polite"></p>

        <button class="voice-button" type="button" data-i18n-aria="listenLabel" aria-label="सुनें">
          <span aria-hidden="true">🔊</span>
          <span data-i18n="listen">सुनें</span>
        </button>
      </section>
    </main>

    <footer class="site-footer">
      <p data-i18n="trustMessage">सरल <span aria-hidden="true">•</span> सुरक्षित <span aria-hidden="true">•</span> आपके लिए</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
